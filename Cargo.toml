[package]
name = "polar-rs"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for Polar.sh payment platform"
license = "GPL-3.0"
repository = "https://github.com/mipsicored/polar-rs"
homepage = "https://polar.sh"
readme = "README.md"
keywords = ["polar", "payments", "sdk", "rust"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.12.26", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
tokio = { version = "1.48.0" }
base64 = "0.22.1"
hmac = "0.12.1"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tokio-test = "0.4.4"
wiremock = "0.6.5"
